services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-please-change-this-secret-key}
      MASTER_KEY: ${MASTER_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://bot:botpass@db:5432/botcloud}
      OPEN_REGISTRATION: ${OPEN_REGISTRATION:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - app_data:/app/data

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: botpass
      POSTGRES_DB: botcloud
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pg_data:
  app_data:
